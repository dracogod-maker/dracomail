<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRACÓ GOD :: Premium Temp Mail</title>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-blue: #00f2ff;
            --glow-color: rgba(0, 242, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 40px var(--glow-color), 
                        0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .main-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
            z-index: -1;
        }

        .header h1 {
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .email-display-section {
            margin-bottom: 25px;
        }

        .email-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--accent-blue);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px var(--glow-color);
        }

        #currentEmail {
            color: var(--accent-blue);
            font-size: 1.05em;
            font-weight: bold;
            word-break: break-all;
            letter-spacing: 0.5px;
            margin-right: 10px;
            text-align: left;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.2em;
            transition: 0.3s;
        }

        .icon-btn:hover {
            color: var(--accent-blue);
            transform: scale(1.1);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            text-transform: uppercase;
            background: linear-gradient(45deg, #007bff, var(--accent-blue));
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
            transform: translateY(-2px);
        }

        .inbox-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            text-align: left;
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .inbox-title {
            color: var(--text-main);
            font-size: 1em;
        }

        .refresh-btn {
            background: transparent;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .refresh-btn:hover {
            text-decoration: underline;
        }

        .email-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
        }

        .email-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent-blue);
            cursor: pointer;
        }

        .email-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .email-sender { font-weight: bold; color: var(--text-main); font-size: 0.85em; }
        .email-subject { color: var(--accent-blue); display: block; margin: 2px 0; font-size: 0.8em; }

        .footer {
            position: fixed;
            bottom: 10px;
            right: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8em;
        }
        .footer strong { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>DRACÓ MAIL</h1>
            <p>Powered by DRACÓ GOD</p>
        </div>

        <div class="email-display-section">
            <div class="email-box">
                <span id="currentEmail">Connecting to server...</span>
                <button class="icon-btn" onclick="copyEmail()" title="Copy Email">📋</button>
            </div>
            <button class="action-btn" onclick="getNewEmail()">✨ Generate New Email</button>
        </div>

        <div class="inbox-section">
            <div class="inbox-header">
                <h2 class="inbox-title">📥 Inbox</h2>
                <button class="refresh-btn" onclick="checkInbox()"><span>🔄</span> Refresh</button>
            </div>
            <ul class="email-list" id="inboxList">
                <li class="email-item" style="text-align:center; color:var(--text-muted); border:none;">Inbox is empty. Waiting for OTP/Mail...</li>
            </ul>
        </div>
    </div>

    <div class="footer">Design & Service by <strong>DRACÓ GOD</strong></div>

    <script>
        // Free API setup using 1secmail public domains
        const domains = ["1secmail.com", "1secmail.org", "1secmail.net"];
        let currentLogin = "";
        let currentDomain = "";

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function getNewEmail() {
            let randomName = Math.random().toString(36.substring(2, 12));
            currentDomain = domains[getRandomInt(domains.length)];
            currentLogin = randomName;
            
            let fullEmail = currentLogin + "@" + currentDomain;
            document.getElementById('currentEmail').innerText = fullEmail;
            
            // Clear inbox view when new email generated
            document.getElementById('inboxList').innerHTML = '<li class="email-item" style="text-align:center; color:var(--text-muted); border:none;">Listening for incoming mails...</li>';
        }

        function copyEmail() {
            let email = document.getElementById('currentEmail').innerText;
            navigator.clipboard.writeText(email).then(() => {
                alert('Email copied to clipboard!');
            });
        }

        function checkInbox() {
            if (!currentLogin) return;
            
            let url = `https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    let inboxList = document.getElementById('inboxList');
                    inboxList.innerHTML = "";
                    
                    if (data.length === 0) {
                        inboxList.innerHTML = '<li class="email-item" style="text-align:center; color:var(--text-muted); border:none;">No messages yet.</li>';
                        return;
                    }
                    
                    data.forEach(msg => {
                        let item = document.createElement('li');
                        item.className = 'email-item';
                        item.innerHTML = `
                            <span class="email-sender">${msg.from}</span>
                            <span class="email-subject">${msg.subject}</span>
                        `;
                        // Click to read message content (OTP)
                        item.onclick = function() {
                            readMessage(msg.id);
                        };
                        inboxList.appendChild(item);
                    });
                })
                .catch(err => console.error("Error fetching mails:", err));
        }

        function readMessage(id) {
            let url = `https://www.1secmail.com/api/v1/?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    alert(`From: ${data.from}\nSubject: ${data.subject}\n\nBody:\n${data.textBody}`);
                });
        }

        // Auto generate email on load
        window.onload = function() {
            getNewEmail();
            // Auto check inbox every 10 seconds for new OTPs
            setInterval(checkInbox, 10000);
        };
    </script>
</body>
</html>
