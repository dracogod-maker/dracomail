<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRACÓ MAIL :: Premium Temp Mail</title>
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-blue: #00f2ff;
            --glow-color: rgba(0, 242, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 0 40px var(--glow-color), 
                        0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header h1 {
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-blue);
            margin-bottom: 5px;
        }

        .header p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .email-display-section {
            margin-bottom: 25px;
        }

        .email-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--accent-blue);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px var(--glow-color);
        }

        #currentEmail {
            color: var(--accent-blue);
            font-size: 0.95em;
            font-weight: bold;
            word-break: break-all;
            text-align: left;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.2em;
            transition: 0.3s;
        }

        .icon-btn:hover {
            color: var(--accent-blue);
            transform: scale(1.1);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            text-transform: uppercase;
            background: linear-gradient(45deg, #007bff, var(--accent-blue));
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
            transform: translateY(-2px);
        }

        .inbox-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            text-align: left;
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .inbox-title {
            color: var(--text-main);
            font-size: 1em;
        }

        .refresh-btn {
            background: transparent;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .refresh-btn:hover {
            text-decoration: underline;
        }

        .email-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
        }

        .email-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent-blue);
        }

        .footer {
            position: fixed;
            bottom: 10px;
            right: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8em;
        }
        .footer strong { color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1>DRACÓ MAIL</h1>
            <p>Powered by DRACÓ GOD</p>
        </div>

        <div class="email-display-section">
            <div class="email-box">
                <span id="currentEmail">Creating secure email...</span>
                <button class="icon-btn" onclick="copyEmail()" title="Copy Email">📋</button>
            </div>
            <button class="action-btn" onclick="createAccount()">✨ Generate New Email</button>
        </div>

        <div class="inbox-section">
            <div class="inbox-header">
                <h2 class="inbox-title">📥 Inbox</h2>
                <button class="refresh-btn" onclick="checkInbox()"><span>🔄</span> Refresh</button>
            </div>
            <ul class="email-list" id="inboxList">
                <li class="email-item" style="text-align:center; color:var(--text-muted); border:none;">Inbox is empty. Waiting for OTP...</li>
            </ul>
        </div>
    </div>

    <div class="footer">Design & Service by <strong>DRACÓ GOD</strong></div>

    <script>
        let currentEmail = "";
        let currentPassword = "";
        let token = "";

        async function createAccount() {
            document.getElementById('currentEmail').innerText = "Generating...";
            try {
                // Get available domain
                let domainRes = await fetch('https://api.mail.tm/domains');
                let domainData = await domainRes.json();
                let domain = domainData['hydra:member'][0].domain;

                let randomString = Math.random().toString(36).substring(2, 10);
                currentEmail = randomString + "@" + domain;
                currentPassword = "Password123!";

                // Create account
                let regRes = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: currentEmail, password: currentPassword })
                });

                if (regRes.ok) {
                    document.getElementById('currentEmail').innerText = currentEmail;
                    getToken();
                } else {
                    document.getElementById('currentEmail').innerText = "Error! Try again.";
                }
            } catch (e) {
                document.getElementById('currentEmail').innerText = "Connection failed!";
            }
        }

        async function getToken() {
            try {
                let res = await fetch('https://api.mail.tm/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: currentEmail, password: currentPassword })
                });
                let data = await res.json();
                token = data.token;
            } catch (e) {
                console.error("Token error");
            }
        }

        async function checkInbox() {
            if (!token) return;
            try {
                let res = await fetch('https://api.mail.tm/messages', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                let data = await res.json();
                let messages = data['hydra:member'];
                let inboxList = document.getElementById('inboxList');
                inboxList.innerHTML = "";

                if (!messages || messages.length === 0) {
                    inboxList.innerHTML = '<li class="email-item" style="text-align:center; color:var(--text-muted); border:none;">No messages yet.</li>';
                    return;
                }

                messages.forEach(msg => {
                    let item = document.createElement('li');
                    item.className = 'email-item';
                    item.innerHTML = `<strong>From:</strong> ${msg.from.address}<br><strong>Subject:</strong> ${msg.subject}`;
                    inboxList.appendChild(item);
                });
            } catch (e) {
                console.error("Inbox error");
            }
        }

        window.onload = function() {
            createAccount();
            setInterval(checkInbox, 8000);
        };

        function copyEmail() {
            if(currentEmail) {
                navigator.clipboard.writeText(currentEmail);
                alert('Email copied successfully!');
            }
        }
    </script>
</body>
</html>
